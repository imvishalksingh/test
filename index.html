<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse the Folio Public Library catalog and manage your reading list.">
    <meta name="theme-color" content="#172b23">
    <title>Folio Public Library</title>
    <link rel="icon" href="assets/images/folio-tab.png" type="image/png" sizes="64x64">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/collection.js" defer></script>
    <script src="assets/js/library.js" defer></script>
    <script src="assets/js/project-files.js" defer></script>
    <script src="assets/js/admin.js" defer></script>
    <script src="assets/js/site.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="wordmark" href="#home" aria-label="Folio Public Library home"><img class="wordmark-name" src="assets/images/folio-wordmark.png" alt="" width="112" height="40"><span class="wordmark-subtitle" aria-hidden="true">Public Library</span></a>
            <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>Menu</button>
            <nav class="site-nav" id="site-nav" aria-label="Main navigation">
                <a href="#home">Home</a><a href="#catalog">Catalog</a><a href="#events">Events</a><a href="#visit">Visit</a>
            </nav>
            <div class="account-controls">
                <a class="button account-trigger" id="open-card" href="#profiles">My Library</a>
                <details class="account-menu" hidden>
                    <summary class="button account-trigger">Account</summary>
                    <div class="account-options"><a href="#account">My Library</a><button class="button account-signout" id="close-card" type="button">Sign out</button></div>
                </details>
            </div>
        </div>
    </header>
    <div id="message" class="wrap" role="status" aria-live="polite"></div>
    <main id="main" tabindex="-1">
        <noscript><section class="wrap missing-page"><h1>Folio Public Library</h1><p>Turn on JavaScript to browse the catalog and use My Library.</p></section></noscript>
    </main>
    <footer class="site-footer">
        <div class="wrap footer-inner">
            <a class="wordmark" href="#home" aria-label="Folio Public Library home"><img class="wordmark-name" src="assets/images/folio-wordmark.png" alt="" width="112" height="40"><span class="wordmark-subtitle" aria-hidden="true">Public Library</span></a>
            <div class="footer-note"><span>Demo library</span><a href="#visit/borrowing">Borrowing guide</a></div>
        </div>
    </footer>

    <template id="view-home">
        <section class="hero">
            <div class="hero-photo" aria-hidden="true"><img src="assets/images/reading-room.jpg" alt="" fetchpriority="high" width="1536" height="1024"></div>
            <div class="wrap hero-inner">
                <h1>Find your<br>next book.</h1>
                <form class="hero-search" role="search">
                    <label class="sr-only" for="hero-query">Search by title, author, or ISBN</label>
                    <div class="search-field"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m15.8 15.8 4.4 4.4"/></svg><input id="hero-query" name="q" type="search" placeholder="Title, author, or ISBN" maxlength="120"><button class="button" type="submit">Search</button></div>
                </form>
            </div>
        </section>
        <div class="quick-links">
            <div class="wrap quick-grid">
                <a href="#visit/hours"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.7"/><path d="M12 6.9V12l3.4 2.2"/></svg><span><strong>Today’s hours</strong><small data-slot="today-hours"></small></span><i class="hours-dot" role="img"></i></a>
                <a href="#profiles" data-slot="card-link"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.7" y="5.5" width="18.6" height="13" rx="2"/><path d="M3 9.5h18M6.5 15h4.2"/></svg><span><strong data-slot="card-title">Get a library card</strong><small data-slot="card-note">Free to join</small></span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 12h15m-6-6 6 6-6 6"/></svg></a>
                <a href="#visit"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.1 9.5c0 5.2-7.1 10.8-7.1 10.8S4.9 14.7 4.9 9.5a7.1 7.1 0 0 1 14.2 0Z"/><circle cx="12" cy="9.5" r="2.3"/></svg><span><strong>Plan your visit</strong><small>18 Linden Street, Bellwater</small></span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 12h15m-6-6 6 6-6 6"/></svg></a>
            </div>
        </div>
        <section class="wrap shelf-section" aria-labelledby="staff-picks">
            <header class="section-head"><h2 id="staff-picks">Staff picks</h2><a class="text-link" href="#catalog">Full catalog <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 12h15m-6-6 6 6-6 6"/></svg></a></header>
            <div class="books-grid shelf-grid" data-slot="book-grid"></div>
        </section>
        <section class="event-band" aria-labelledby="home-events">
            <div class="wrap event-layout">
                <div class="event-intro">
                    <h2 id="home-events">This week</h2>
                    <a class="text-link" href="#events">Event calendar <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 12h15m-6-6 6 6-6 6"/></svg></a>
                    <img class="event-photo" src="assets/images/reading-club.jpg" alt="Readers with books and mugs at a library table" width="1020" height="680" loading="lazy" decoding="async">
                </div>
                <ul class="event-list" data-slot="events"></ul>
            </div>
        </section>
    </template>

    <template id="view-catalog">
        <section class="wrap catalog-area" aria-labelledby="catalog-title">
            <form class="catalog-form" role="search">
                <div class="catalog-mast">
                    <h1 id="catalog-title">Catalog</h1>
                    <label class="sr-only" for="catalog-query">Search by title, author, or ISBN</label>
                    <div class="search-field"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m15.8 15.8 4.4 4.4"/></svg><input id="catalog-query" name="q" type="search" placeholder="Title, author, or ISBN" maxlength="120"><button class="button" type="submit">Search</button></div>
                </div>
                <div class="catalog-filters">
                    <fieldset class="category-picker">
                        <legend class="sr-only">Category</legend>
                        <div class="category-options" data-slot="category-options"><label class="category-chip"><input type="radio" name="category" value="" checked><span>All books</span></label></div>
                    </fieldset>
                    <div class="catalog-options">
                        <label class="check"><input type="checkbox" name="available"> Available now</label>
                        <label class="catalog-sort"><span class="sr-only">Sort by</span><select name="sort"><option value="">Shelf order</option><option value="title">Title A–Z</option><option value="recent">Newest publication</option></select></label>
                    </div>
                </div>
            </form>
            <p class="result-count" data-slot="result-count" role="status"></p>
            <div class="books-grid" data-slot="book-grid"></div>
            <div class="empty" data-slot="catalog-empty" hidden><h2>No matching books</h2><button class="button secondary" data-slot="clear-filters" type="button">Clear filters</button></div>
        </section>
    </template>

    <template id="book-card">
        <article class="book-card">
            <a data-slot="book-link"><div class="cover-stage"><img class="book-jacket" alt="" loading="lazy" decoding="async"></div><div class="book-info"><span class="book-category" data-slot="category"></span><h3 data-slot="title"></h3><p data-slot="author"></p></div></a>
            <p class="availability"><span></span><b data-slot="availability"></b></p>
        </article>
    </template>

    <template id="view-book">
        <section class="wrap detail-page">
            <a class="text-link back-link" href="#catalog"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 12h-15m6-6-6 6 6 6"/></svg>Back to the catalog</a>
            <div class="book-detail">
                <div class="cover-stage"><img class="book-jacket" alt="" decoding="async"></div>
                <div class="detail-copy">
                    <a class="book-category" data-slot="category"></a><h1 data-slot="title"></h1><p class="author-line" data-slot="author"></p><p class="synopsis" data-slot="description"></p>
                    <dl class="book-facts"><div><dt>Published</dt><dd data-slot="year"></dd></div><div><dt>Format</dt><dd>Print book</dd></div><div><dt>ISBN</dt><dd data-slot="isbn"></dd></div></dl>
                    <div class="loan-panel"><p class="availability"><span></span><b data-slot="availability"></b></p><div class="button-row" data-slot="book-actions"></div></div>
                </div>
            </div>
        </section>
    </template>

    <template id="view-events">
        <section class="page-banner"><div class="wrap"><h1>Events</h1></div></section>
        <section class="wrap events-page" aria-label="Upcoming events"><ul class="event-list" data-slot="events"></ul></section>
    </template>

    <template id="event-row">
        <li class="event-row">
            <time class="event-date"><span data-slot="month"></span><strong data-slot="day"></strong></time>
            <div class="event-body"><span class="event-kind" data-slot="event-kind"></span><h2 data-slot="title"></h2><p class="event-meta" data-slot="event-meta"></p><p class="event-copy" data-slot="event-copy"></p></div>
            <div class="event-booking" data-slot="event-actions"><span class="event-slots" data-slot="event-slots"></span></div>
        </li>
    </template>

    <template id="view-visit">
        <section class="page-banner"><div class="wrap"><h1>Visit the library</h1></div></section>
        <div class="wrap visit-page">
            <div class="visit-grid">
                <div>
                    <section id="hours"><h2>Opening hours</h2><table class="hours-table"><caption class="sr-only">Weekly opening hours</caption><tbody data-slot="hours"></tbody></table></section>
                    <section class="access-details"><h2>Location &amp; access</h2><p>18 Linden Street, Bellwater <small>(demo address)</small></p><p>Step-free entry on Linden Street. Accessible restroom on the ground floor.</p></section>
                </div>
                <img class="visit-photo" src="assets/images/stacks.jpg" alt="Rows of wooden bookshelves" width="950" height="635">
            </div>
            <section id="borrowing" class="borrowing"><h2>Borrowing guide</h2><p>Borrow up to five books for 21 days. Renew each book once before it’s overdue.</p><a class="button primary" href="#profiles" data-slot="card-link">Get a library card</a></section>
        </div>
    </template>

    <template id="view-profiles">
        <section class="wrap auth-area">
            <div class="auth-photo"><img src="assets/images/reading-room.jpg" alt="" width="1536" height="1024"></div>
            <div class="auth-panel">
                <h1>Library cards</h1><p>Cards and loans are saved in this browser.</p>
                <div class="profile-list" data-slot="profile-list"></div>
                <form class="auth-form"><label>Name <input name="name" autocomplete="given-name" placeholder="Your name" maxlength="60" required></label><button class="button primary" type="submit">Create a card</button></form>
            </div>
        </section>
    </template>

    <template id="view-account">
        <div class="account-page"><div class="wrap account-area">
            <header class="account-heading"><h1>My Library</h1><p data-slot="member-name"></p></header>
            <div class="account-grid">
                <section class="account-panel account-loans" aria-labelledby="loans-title">
                    <header class="account-panel-head"><h2 id="loans-title">Loans</h2><span class="loan-count" data-slot="loan-count"></span></header>
                    <div class="account-empty" data-slot="loans-empty"><p>No books on loan.</p><a class="button primary" href="#catalog">Find a book</a></div><ul class="account-list" data-slot="loans"></ul>
                </section>
                <div class="account-side">
                    <section class="account-panel" aria-labelledby="saved-title"><header class="account-panel-head"><h2 id="saved-title">Reading list</h2></header><div class="account-empty" data-slot="saved-empty"><p>Save a book from the catalog to start your list.</p></div><ul class="account-list" data-slot="saved"></ul></section>
                    <section class="account-panel" id="bookings" aria-labelledby="bookings-title"><header class="account-panel-head"><h2 id="bookings-title">Event bookings</h2></header><div class="account-empty" data-slot="bookings-empty"><p>No upcoming bookings.</p><a class="text-link" href="#events">See events</a></div><ul class="account-list" data-slot="bookings"></ul></section>
                </div>
            </div>
        </div></div>
    </template>

    <template id="account-item">
        <li><span class="book-thumbnail" aria-hidden="true"><img alt="" loading="lazy"></span><div class="account-item"><a class="list-title" data-slot="title"></a><p data-slot="meta"></p></div><div class="button-row" data-slot="actions"></div></li>
    </template>

    <template id="view-admin">
        <div class="admin-page">
            <div class="wrap admin-area">
                <header class="admin-heading"><h1>Library admin</h1><p>Loans, reader cards, and events are saved in this browser.</p></header>
                <nav class="admin-tabs" aria-label="Admin sections"><a href="#admin/catalog">Catalog</a><a href="#admin/loans">Loans</a><a href="#admin/readers">Readers</a><a href="#admin/events">Events</a></nav>
                <div data-slot="admin-section"></div>
            </div>
        </div>
    </template>

    <template id="admin-catalog">
        <section class="project-files account-panel" aria-labelledby="project-files-title">
            <div>
                <h2 id="project-files-title">Project files</h2>
                <p data-slot="project-status" role="status"></p>
            </div>
            <div class="button-row">
                <button class="button primary" type="button" data-slot="connect-project">Connect project folder</button>
                <button class="button secondary" type="button" data-slot="sync-project" hidden>Save earlier browser changes</button>
            </div>
        </section>
        <div class="admin-grid">
            <section class="account-panel admin-panel" aria-labelledby="admin-books-title">
                <header class="account-panel-head"><h2 id="admin-books-title">Book inventory</h2></header>
                <div class="admin-search"><label for="admin-search">Find a title</label><input id="admin-search" type="search" placeholder="Title, author, or ISBN" maxlength="120"></div>
                <ul class="admin-list" data-slot="inventory"></ul>
                <p class="account-empty" data-slot="inventory-empty" hidden>No matching books.</p>
            </section>
            <section class="account-panel admin-editor" id="book-editor" aria-labelledby="editor-title">
                <header class="account-panel-head"><h2 id="editor-title" data-slot="editor-title">Add a book</h2></header>
                <form class="admin-form">
                    <label>Title <input name="title" maxlength="120" required></label>
                    <label>Author <input name="author" maxlength="100" required></label>
                    <label>ISBN-13 <input name="isbn" inputmode="numeric" pattern="[0-9]{13}" maxlength="13" required></label>
                    <label>Category <select name="category" required><option value="">Choose a category</option></select></label>
                    <div class="admin-fields"><label>Year <input name="year" type="number" min="1" max="9999" required></label><label>Copies <input name="copies" type="number" min="0" max="999" value="1" required></label></div>
                    <label>Book cover <input name="cover" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="cover-formats"></label>
                    <small class="field-note" id="cover-formats">Optional. JPG, PNG, or WebP up to 8 MB.</small>
                    <img class="admin-cover-preview" data-slot="cover-preview" alt="Book cover preview" hidden>
                    <label>Description <textarea name="description" rows="4" maxlength="600"></textarea></label>
                    <div class="button-row"><button class="button primary" type="submit" data-slot="save-book">Add book</button><a class="button secondary" href="#admin/catalog" data-slot="cancel-edit" hidden>Cancel</a></div>
                </form>
            </section>
        </div>
    </template>

    <template id="admin-loans">
        <div class="admin-grid">
            <section class="account-panel admin-panel" aria-labelledby="admin-loans-title">
                <header class="account-panel-head"><h2 id="admin-loans-title">Active loans</h2></header>
                <ul class="admin-list" data-slot="loans"></ul><p class="account-empty" data-slot="loans-empty" hidden>No active loans.</p>
            </section>
            <section class="account-panel admin-editor" aria-labelledby="checkout-title">
                <header class="account-panel-head"><h2 id="checkout-title">Check out a book</h2></header>
                <p class="account-empty" data-slot="checkout-empty" hidden>Add a library card before checking out a book. <a href="#profiles">Library cards</a></p>
                <form class="admin-form">
                    <label>Reader <select name="reader" required><option value="">Choose a reader</option></select></label>
                    <label>Book <select name="book" required><option value="">Choose a book</option></select></label>
                    <button class="button primary" type="submit">Check out</button>
                </form>
            </section>
        </div>
    </template>

    <template id="admin-readers">
        <section class="account-panel admin-panel" aria-labelledby="admin-readers-title">
            <header class="account-panel-head"><h2 id="admin-readers-title">Library cards</h2></header>
            <p class="account-empty" data-slot="readers-empty" hidden>No library cards yet. <a href="#profiles">Create a card</a></p><ul class="admin-list" data-slot="readers"></ul>
        </section>
    </template>

    <template id="admin-events">
        <div class="admin-grid">
            <section class="account-panel admin-panel" aria-labelledby="admin-events-title">
                <header class="account-panel-head"><h2 id="admin-events-title">Upcoming events</h2></header>
                <div class="admin-events" data-slot="events"></div>
            </section>
            <section class="account-panel admin-editor" aria-labelledby="event-editor-title">
                <header class="account-panel-head"><h2 id="event-editor-title">Add an event</h2></header>
                <form class="admin-form" data-slot="event-form">
                    <label>Event name <input name="title" maxlength="100" required></label>
                    <div class="admin-fields"><label>Date <input name="date" type="date" required></label><label>Time <input name="time" type="time" required></label></div>
                    <div class="admin-fields"><label>Room <input name="room" maxlength="70" required></label><label>Spots <input name="capacity" type="number" min="1" max="999" value="12" required></label></div>
                    <label>Type <select name="type"><option>Library event</option><option>Book club</option><option>Workshop</option><option>For families</option></select></label>
                    <label>Description <textarea name="description" rows="3" maxlength="400"></textarea></label>
                    <button class="button primary" type="submit">Add event</button>
                </form>
            </section>
        </div>
    </template>

    <template id="admin-row">
        <li class="admin-row"><div class="admin-row-copy"><h3 data-slot="title"></h3><p data-slot="meta"></p></div><div class="button-row" data-slot="actions"></div></li>
    </template>

    <template id="view-missing">
        <section class="wrap missing-page"><h1>Page not found</h1><a class="button primary" href="#catalog">Browse the catalog</a></section>
    </template>
</body>
</html>
